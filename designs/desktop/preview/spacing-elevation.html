<!doctype html>

<html lang="en"><head><meta charset="utf-8"><title>Elevation philosophy</title>

<link rel="stylesheet" href="../colors_and_type.css">

</head><body><div class="card-pad">
<div class="row" style="gap:16px;align-items:stretch">
  <div style="flex:1;background:var(--surface);border:1px solid var(--border-input);border-radius:8px;padding:16px">
    <div class="m-ui-tiny-section" style="margin-bottom:6px">Canonical card</div>
    <div class="spec" style="color:var(--text-secondary)">surface + 1px borderInput + 8r + NO shadow</div>
  </div>
  <div style="flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:0 8px 24px rgba(31,42,61,0.10), 0 2px 8px rgba(31,42,61,0.06)">
    <div class="m-ui-tiny-section" style="margin-bottom:6px">Dialog only</div>
    <div class="spec" style="color:var(--text-secondary)">Single allowed shadow — modals.</div>
  </div>
</div>
</div></body></html>
