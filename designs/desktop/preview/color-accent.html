<!doctype html>
<!-- @dsCard group="Colors" -->
<html lang="en"><head><meta charset="utf-8"><title>Brass accent</title>

<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">

</head><body><div class="card-pad">
<div class="eyebrow">Accent — for action + state only</div>
<div class="row-tight">
  
  <div class="col" style="gap:4px;flex:1;min-width:80px">
    <div style="height:48px;border-radius:6px;background:#283C5F;border:1px solid var(--border-subtle)"></div>
    <div class="spec" style="color:var(--text-primary);font-weight:600">accent</div>
    <div class="spec">#283C5F</div>
  </div>
  
  <div class="col" style="gap:4px;flex:1;min-width:80px">
    <div style="height:48px;border-radius:6px;background:#3B5182;border:1px solid var(--border-subtle)"></div>
    <div class="spec" style="color:var(--text-primary);font-weight:600">accent-warm</div>
    <div class="spec">#3B5182</div>
  </div>
  
  <div class="col" style="gap:4px;flex:1;min-width:80px">
    <div style="height:48px;border-radius:6px;background:#8897D1;border:1px solid var(--border-subtle)"></div>
    <div class="spec" style="color:var(--text-primary);font-weight:600">accent-amber</div>
    <div class="spec">#8897D1</div>
  </div>
  
  <div class="col" style="gap:4px;flex:1;min-width:80px">
    <div style="height:48px;border-radius:6px;background:#1F2A3D;border:1px solid var(--border-subtle)"></div>
    <div class="spec" style="color:var(--text-primary);font-weight:600">on-accent</div>
    <div class="spec">#1F2A3D</div>
  </div>
</div>
<div class="spec">"The Writer‑First Rule": accent is for action and state, not decoration.</div>
</div></body></html>
