<!doctype html>
<!-- @dsCard group="Colors" -->
<html lang="en"><head><meta charset="utf-8"><title>Dark mode preview</title>

<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">

</head><body><div class="card-pad">
<div class="row" style="gap:8px">
  <div style="flex:1;background:#12161F;border:1px solid #2E3647;border-radius:8px;padding:16px;color:#F5F0E8">
    <div style="font:700 16px/1.2 Georgia;margin-bottom:6px">夜航船</div>
    <div style="font:400 12px var(--font-sans);color:#8E97AB">Night Boat</div>
    <div style="font:italic 12px Georgia;color:#C2C8D6;margin-top:8px">"船家的灯笼挂在桅杆上…"</div>
    <div style="display:inline-block;margin-top:10px;padding:4px 10px;background:#8897D1;color:#12161F;border-radius:6px;font:500 11px var(--font-sans)">brass accent on ink</div>
  </div>
  <div class="col" style="width:200px;gap:4px">
    <div class="eyebrow" style="color:var(--text-muted)">Reveric Dark</div>
    <div class="spec">canvas #12161F</div>
    <div class="spec">surface #181D28</div>
    <div class="spec">text-primary #F5F0E8</div>
    <div class="spec">accent #8897D1</div>
  </div>
</div>
