<!doctype html>
<!-- @dsCard group="Colors" -->
<html lang="en"><head><meta charset="utf-8"><title>Semantic</title>

<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">

</head><body><div class="card-pad">
<div class="row-tight">
  <div class="col" style="gap:4px;flex:1">
    <div style="height:36px;border-radius:6px;background:#E8F5E8;border:1px solid #4A7C59;color:#4A7C59;display:flex;align-items:center;padding:0 10px;font:500 11px var(--font-sans)">addition</div>
    <div class="spec">addition · #E8F5E8 / #4A7C59</div>
  </div>
  <div class="col" style="gap:4px;flex:1">
    <div style="height:36px;border-radius:6px;background:#FDE8E8;border:1px solid #C53030;color:#C53030;display:flex;align-items:center;padding:0 10px;font:500 11px var(--font-sans)">deletion</div>
    <div class="spec">deletion · #FDE8E8 / #C53030</div>
  </div>
  <div class="col" style="gap:4px;flex:1">
    <div style="height:36px;border-radius:6px;background:#FEF3C7;border:1px solid #D97706;color:#D97706;display:flex;align-items:center;padding:0 10px;font:500 11px var(--font-sans)">warning</div>
    <div class="spec">warning · #FEF3C7 / #D97706</div>
  </div>
  <div class="col" style="gap:4px;flex:1">
    <div style="height:36px;border-radius:6px;background:transparent;border-left:3px solid #8897D1;display:flex;align-items:center;padding:0 10px;font:italic 13px var(--font-serif);color:var(--text-secondary)">blockquote</div>
    <div class="spec">blockquote · #8897D1</div>
  </div>
</div>
</div></body></html>
