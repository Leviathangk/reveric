<!doctype html>
<!-- @dsCard group="Colors" -->
<html lang="en"><head><meta charset="utf-8"><title>Parchment surfaces</title>

<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">

</head><body><div class="card-pad">
<div class="eyebrow">Tonal layer scale (light → high)</div>
<div class="row-tight">
  
  <div class="col" style="gap:4px;flex:1;min-width:80px">
    <div style="height:48px;border-radius:6px;background:#FEFCF9;border:1px solid var(--border-subtle)"></div>
    <div class="spec" style="color:var(--text-primary);font-weight:600">canvas</div>
    <div class="spec">#FEFCF9</div>
  </div>
  
  <div class="col" style="gap:4px;flex:1;min-width:80px">
    <div style="height:48px;border-radius:6px;background:#FBFAF7;border:1px solid var(--border-subtle)"></div>
    <div class="spec" style="color:var(--text-primary);font-weight:600">surface</div>
    <div class="spec">#FBFAF7</div>
  </div>
  
  <div class="col" style="gap:4px;flex:1;min-width:80px">
    <div style="height:48px;border-radius:6px;background:#F4F3F0;border:1px solid var(--border-subtle)"></div>
    <div class="spec" style="color:var(--text-primary);font-weight:600">surface-dim</div>
    <div class="spec">#F4F3F0</div>
  </div>
  
  <div class="col" style="gap:4px;flex:1;min-width:80px">
    <div style="height:48px;border-radius:6px;background:#F8F7F4;border:1px solid var(--border-subtle)"></div>
    <div class="spec" style="color:var(--text-primary);font-weight:600">surface-container</div>
    <div class="spec">#F8F7F4</div>
  </div>
  
  <div class="col" style="gap:4px;flex:1;min-width:80px">
    <div style="height:48px;border-radius:6px;background:#FCFBF9;border:1px solid var(--border-subtle)"></div>
    <div class="spec" style="color:var(--text-primary);font-weight:600">surface-container-high</div>
    <div class="spec">#FCFBF9</div>
  </div>
</div>
<div class="spec">Depth comes from these tonal layers + 1px borders. NEVER add shadow to standard cards/panels/inputs.</div>
</div></body></html>
